; Voice-Authenticated Smart Parking Lock - reference implementation.
;
; Built WITHOUT `framework = arduino` on purpose. The Arduino core claims
; Timer0 for millis()/delay() and installs its own TIMER0_OVF_vect, which
; collides head-on with this project's requirement that Timer0 be the 1 ms
; system tick. Dropping the framework also removes about 1 KB of flash and the
; HardwareSerial ring buffers from SRAM.
;
;   pio run                 -> .pio/build/uno/firmware.elf and firmware.hex
;   pio run -t clean
;   pio run -t upload       -> flash a real board (not needed for Proteus)
;
; Point Proteus's Arduino Uno "Program File" property at firmware.hex, or at
; firmware.elf if you want source-level debugging inside the simulator.

[env:uno]
platform = atmelavr
board = uno
board_build.f_cpu = 16000000L

build_flags =
    -Os
    -Wall
    -Wextra
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -ffunction-sections
    -fdata-sections
    -flto
build_unflags =
    -std=gnu++11

build_src_filter = +<*>

; Serial monitor for the UART debug output on D0/D1.
monitor_speed = 115200
